#
# application.yml — главный конфигурационный файл Spring Boot.

#Что нужно сделать:
#  - Указать настройки подключения к базе данных.
#  - Указать порт приложения.
#  - Настроить параметры безопасности и JWT.
#  - Включить Swagger UI.

server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver: org.postgresql.Driver

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    lifetime: 1d
    issuer: ${APP_JWT_ISSUER:bank_rest}
    secret: ${APP_JWT_SECRET}

  admin:
    name: ${ADMIN_LOGIN:admin}
    email: ${ADMIN_EMAIL:admin@mail.com}
    password: ${ADMIN_PASSWORD:admin123}